spring.application.name=demo

# ===== PostgreSQL =====
# Create the database first:  CREATE DATABASE fintrack;
# Override these with real values via env vars in production, never commit real credentials.
spring.datasource.url=jdbc:postgresql://localhost:5432/fintrack
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# "update" is fine for development. Switch to a proper migration tool (Flyway/Liquibase)
# before this goes anywhere near production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
