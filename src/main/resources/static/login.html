<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinTrack — Log in</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>

<body>

<div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
</div>

<div id="notifications" aria-live="polite"></div>

<main class="auth-page">

    <section class="card auth-card spot">

        <div class="auth-brand">
            <div class="brand-logo"><i data-lucide="wallet"></i></div>
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Log in to your FinTrack account</p>
        </div>

        <form id="loginForm" class="auth-form">

            <label for="email">Email</label>
            <div class="field">
                <i data-lucide="mail"></i>
                <input id="email" type="email" required
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <label for="password">Password</label>
            <div class="field">
                <i data-lucide="lock"></i>
                <input id="password" type="password" required
                       placeholder="Your password" autocomplete="current-password">
                <button type="button" class="field-toggle"
                        data-toggle-password="password" aria-label="Show password">
                    <i data-lucide="eye"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                <i data-lucide="log-in"></i>
                <span>Log in</span>
            </button>

        </form>

        <p class="auth-switch">
            Don't have an account? <a href="register.html">Sign up</a>
        </p>

    </section>

</main>

<script src="auth.js"></script>
<script>

    document.getElementById("loginForm")
        .addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const button = document.getElementById("submitBtn");

            button.disabled = true;

            try {

                const ok = await login(email, password);

                if (ok) {
                    window.location.href = "index.html";
                    return;
                }

                showNotification("Invalid email or password.", "error");

            } catch (error) {

                console.error(error);

                showNotification("Server error. Please try again.", "error");
            }

            button.disabled = false;

        });

</script>

</body>

</html>
